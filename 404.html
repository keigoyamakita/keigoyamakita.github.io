<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 ページが見つかりません｜やまきたけいごの部屋🐶</title>
  <!-- 404.html は任意のURLで表示されるため、パスはすべてルートからの絶対パスにする -->
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <style>
    :root {
      --bg: #0d1117; --bg2: #161b22; --border: #30363d;
      --text: #e6edf3; --text2: #8b949e; --accent: #58a6ff; --accent2: #3fb950;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
      font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.7; text-align: center;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    main { max-width: 480px; }
    .code {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: clamp(3.5rem, 14vw, 6rem); font-weight: 800; letter-spacing: 0.08em;
      color: var(--accent); line-height: 1;
    }
    .avatar {
      width: 200px; height: 200px; margin: 1.5rem auto; border-radius: 50%;
      overflow: hidden; border: 2px solid var(--border); background: var(--bg2);
      animation: sniff 2.4s ease-in-out infinite;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    @keyframes sniff { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .avatar { animation: none; } }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: var(--text2); font-size: 0.95rem; }
    .path { font-family: 'SFMono-Regular', Consolas, monospace; color: var(--accent2); word-break: break-all; }
    .btn {
      display: inline-block; margin-top: 1.75rem; padding: 0.7rem 1.6rem; border-radius: 8px;
      background: var(--accent); color: #0d1117; font-weight: 600; text-decoration: none;
    }
    .btn:hover { background: #79c0ff; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <div class="avatar"><img src="/images/profile-pixel.png" alt="山北啓吾と犬たち（ドット絵）" width="200" height="200"></div>
    <h1>ページが見つかりませんでした</h1>
    <p>犬たちがあちこち嗅ぎまわりましたが、<br><span class="path" id="path"></span> は見つかりませんでした。<br>URLが間違っているか、ページが移動した可能性があります。</p>
    <a class="btn" href="/">トップページへ戻る</a>
  </main>
  <script>
    document.getElementById('path').textContent = decodeURIComponent(location.pathname);
  </script>
</body>
</html>
